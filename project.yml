name: Usage
options:
  deploymentTarget:
    macOS: "14.0"

packages:
  UsageKit:
    path: Packages/UsageKit

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    APP_GROUP: $(TeamIdentifierPrefix)io.radison.usage

targets:
  Usage:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Usage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        AppGroup: $(APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.radison.usage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Usage.entitlements
    dependencies:
      - target: UsageWidget
      - package: UsageKit
        product: UsageKit
      - package: UsageKit
        product: UsageViews

  UsageWidget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Usage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.radison.usage.widget
        CODE_SIGN_ENTITLEMENTS: Widget/UsageWidget.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: UsageKit
        product: UsageKit
      - package: UsageKit
        product: UsageViews
